name: TripMate CI

on:
  push:
    branches:
      - main
      - "feature/**"    # Trigger on all feature branches
      - "bugfix/**"
      - "hotfix/**"
  pull_request:
    branches: [main]

jobs:
  # ── Backend: Lint + Test ────────────────────────────────
  backend:
    name: Backend (Python 3.13)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # Updated from v3

      - name: Set up Python 3.13
        uses: actions/setup-python@v5  # Updated from v4
        with:
          python-version: "3.13"    # Matches approved stack (was incorrectly 3.10)

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        working-directory: backend
        env:
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          OPENAI_API_KEY: "sk-dummy-key-for-ci"
        run: |
          echo "✅ Pytest will run here (tests added in Milestone 2)"

  # ── Frontend: Lint + Type Check ─────────────────────────
  frontend:
    name: Frontend (Node 20 / pnpm)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        working-directory: frontend
        run: pnpm tsc --noEmit

      - name: Run ESLint
        working-directory: frontend
        run: pnpm lint
