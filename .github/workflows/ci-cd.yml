name: TripMate CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Lint Codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      
      - name: Install Python Linter (Flake8)
        run: pip install flake8
        
      - name: Lint Backend Code
        run: flake8 backend/app ml_service --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint Frontend Code
        working-directory: ./frontend
        run: npm run lint

  test-backend:
    name: Backend Pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: tripmate
          POSTGRES_PASSWORD: password
          POSTGRES_DB: tripmatedb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          pip install --no-cache-dir -r requirements.txt
          pip install pytest httpx

      - name: Run Pytest Suite
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+psycopg2://tripmate:password@localhost:5432/tripmatedb
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_secret_key_123
        run: PYTHONPATH=. pytest tests/

  test-frontend:
    name: Frontend Jest & Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Jest Unit Tests
        working-directory: ./frontend
        run: npm run test --if-present || npx jest

      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        working-directory: ./frontend
        run: npx playwright test

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: tripmate/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build ML Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./ml_service
          push: false
          tags: tripmate/ml-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: tripmate/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Production Deployment
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Simulate Production Deployment
        run: |
          echo "==========================================="
          echo "🚀 INITIATING PRODUCTION DEPLOYMENT 🚀"
          echo "==========================================="
          echo ""
          echo "Authenticating with container registry..."
          echo "Pulling latest docker-compose artifacts..."
          echo "Running zero-downtime rolling update on main server cluster..."
          echo ""
          echo "Deployment simulated successfully."
          echo "In a live environment, SSH commands or AWS ECS deployment steps would be executed here."
