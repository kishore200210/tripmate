version: "1"

services:
  # 1. FastAPI Backend
  - type: web
    name: tripmate-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false # You must set this in the Render Dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: tripmate-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: tripmate-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: tripmate-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: tripmate-redis
          property: connectionString

  # 2. Redis (Key Value)
  - type: keyvalue
    name: tripmate-redis
    ipAllowList: [] # internal only
    plan: free

databases:
  # 3. PostgreSQL
  - name: tripmate-db
    databaseName: tripmatedb
    user: tripmate
    plan: free
