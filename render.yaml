version: "1"

services:
  # 1. FastAPI Backend
  - type: web
    name: tripmate-backend
    env: docker
    plan: free
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false # You must set this in the Render Dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: tripmate-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: tripmate-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: tripmate-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: tripmate-redis
          property: connectionString

  # 2. Redis (Key Value)
  - type: keyvalue
    name: tripmate-redis
    ipAllowList: [] # internal only
    plan: free

databases:
  # 3. PostgreSQL
  - name: tripmate-db
    databaseName: tripmatedb
    user: tripmate
    plan: free
