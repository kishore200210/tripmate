version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: tripmate_db
    restart: always
    environment:
      POSTGRES_USER: tripmate
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tripmatedb
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripmate -d tripmatedb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tripmate_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml_service:
    build: 
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: tripmate_ml
    restart: always
    ports:
      - "8001:8001"
    environment:
      - WORKERS=1

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: tripmate_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://tripmate:password@db:5432/tripmatedb
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ML_SERVICE_URL=http://ml_service:8001
      - SECRET_KEY=supersecretkey12345
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml_service:
        condition: service_started

  celery_worker:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: tripmate_celery
    restart: always
    command: ["celery", "-A", "app.core.celery_app", "worker", "--loglevel=info"]
    environment:
      - DATABASE_URL=postgresql+psycopg2://tripmate:password@db:5432/tripmatedb
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ML_SERVICE_URL=http://ml_service:8001
      - SECRET_KEY=supersecretkey12345
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tripmate_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
