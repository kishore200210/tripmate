[pytest]
# ── Test Discovery ─────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── Async Mode ─────────────────────────────────────────────
# Required for pytest-asyncio to discover and run async test functions.
asyncio_mode = auto

# ── Markers ────────────────────────────────────────────────
markers =
    unit: Pure unit tests with no database or external dependencies.
    integration: Tests that hit a real test database.
    e2e: Full end-to-end tests via the FastAPI TestClient.
    slow: Tests that take more than 1 second.

# ── Output ─────────────────────────────────────────────────
addopts = -v --tb=short
