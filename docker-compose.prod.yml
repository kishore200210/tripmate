version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: tripmate_db_prod
    restart: always
    environment:
      POSTGRES_USER: tripmate
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tripmatedb
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripmate -d tripmatedb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tripmate_redis_prod
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml_service:
    build: 
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: tripmate_ml_prod
    restart: always
    environment:
      - WORKERS=2

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: tripmate_backend_prod
    restart: always
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=tripmate
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=tripmatedb
      - DATABASE_URL=postgresql+psycopg://tripmate:password@db:5432/tripmatedb
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ML_SERVICE_URL=http://ml_service:8001
      - APP_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml_service:
        condition: service_started

  celery_worker:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: tripmate_celery_prod
    restart: always
    command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info"]
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=tripmate
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=tripmatedb
      - DATABASE_URL=postgresql+psycopg://tripmate:password@db:5432/tripmatedb
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ML_SERVICE_URL=http://ml_service:8001
      - APP_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tripmate_frontend_prod
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=https://api.tripmate.com/v1 # Placeholder for actual prod URL
    depends_on:
      - backend

volumes:
  postgres_data_prod:
